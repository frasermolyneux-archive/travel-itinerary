name: Destroy Environment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to destroy"
        required: true
        type: choice
        default: dev
        options:
          - dev
          - prd
      apply:
        description: "Apply the guarded retirement plan after reviewing a plan-only run"
        required: true
        type: boolean
        default: false

permissions: {}

jobs:
  terraform-destroy:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    environment: ${{ inputs.environment == 'prd' && 'Production' || 'Development' }}
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_USE_AZUREAD: "true"
      ARM_USE_OIDC: "true"
    concurrency:
      group: ${{ github.repository }}-${{ inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Azure Login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - id: gcp-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Select the unwrapped pinned CLI for JSON validation
        uses: frasermolyneux/actions/terraform-setup@terraform-setup/v1.0.0
        with:
          terraform-folder: terraform
          terraform_wrapper: "false"

      - name: Plan retirement only inside this isolated job
        run: |
          set -euo pipefail
          umask 077
          terraform -chdir=terraform init -input=false -lockfile=readonly \
            -backend-config="backends/$ENVIRONMENT.backend.hcl"
          terraform -chdir=terraform validate
          terraform -chdir=terraform plan -input=false -destroy \
            -var-file="tfvars/$ENVIRONMENT.tfvars" -out=retirement.tfplan

      - name: Stop if retirement would destroy retained Google resources
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          terraform -chdir=terraform show -json retirement.tfplan |
            python3 .github/scripts/check_gcp_handover.py destroy --environment "$ENVIRONMENT"

      - name: Apply only the validated retirement plan
        if: inputs.apply
        run: terraform -chdir=terraform apply -input=false retirement.tfplan

      - name: Remove automatically recreated Failure Anomalies rule
        if: inputs.apply && inputs.environment == 'dev'
        shell: bash
        run: |
          set -euo pipefail
          SMART_DETECTOR_ID="/subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}/resourceGroups/rg-travel-itinerary-dev-swedencentral/providers/Microsoft.AlertsManagement/smartDetectorAlertRules/Failure Anomalies - ai-travel-itinerary-dev-swedencentral"

          if az resource show --ids "$SMART_DETECTOR_ID" --api-version 2021-04-01 --only-show-errors >/dev/null 2>&1; then
            echo "Deleting $SMART_DETECTOR_ID"
            az resource delete --ids "$SMART_DETECTOR_ID" --api-version 2021-04-01 --only-show-errors
          fi

      - name: Assert development resource group is empty
        if: inputs.apply && inputs.environment == 'dev'
        shell: bash
        run: |
          set -euo pipefail
          RESOURCE_GROUP="rg-travel-itinerary-dev-swedencentral"
          SERVICE_PLAN_ID="/subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.Web/serverfarms/asp-travel-itinerary-dev-swedencentral-default"

          for ATTEMPT in {1..6}; do
            REMAINING_IDS=$(az resource list --resource-group "$RESOURCE_GROUP" --query "[].id" --output tsv --only-show-errors)
            SERVICE_PLAN_EXISTS=false

            if az resource show --ids "$SERVICE_PLAN_ID" --only-show-errors >/dev/null 2>&1; then
              SERVICE_PLAN_EXISTS=true
            fi

            if [ -z "$REMAINING_IDS" ] && [ "$SERVICE_PLAN_EXISTS" = false ]; then
              echo "$RESOURCE_GROUP is empty and the owned development App Service plan is absent"
              exit 0
            fi

            if [ "$ATTEMPT" -lt 6 ]; then
              echo "Resources remain after destroy; retrying inventory assertion in 10 seconds"
              sleep 10
            fi
          done

          echo "::error::Development destroy left Azure resources behind"
          if [ -n "$REMAINING_IDS" ]; then
            echo "Remaining resource IDs:"
            printf '%s\n' "$REMAINING_IDS"
          fi
          if [ "$SERVICE_PLAN_EXISTS" = true ] && ! grep -Fqx "$SERVICE_PLAN_ID" <<<"$REMAINING_IDS"; then
            echo "$SERVICE_PLAN_ID"
          fi
          exit 1
